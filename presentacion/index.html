'use strict';
const memory='../TFM%20Grupo%202%20%282%29.md',tables='../revision-final/tablas-corregidas.md',review='../revision-final/REVISION-POR-SECCIONES.md';
const slides=[
{title:'PromptGuard FinTech',section:'Defensa del trabajo de fin de máster',dark:true,cover:true,body:`<h1>PromptGuard<br><span class="accent">FinTech</span></h1><p class="lead">Evaluación y defensa de un asistente bancario basado en LLM</p><div class="cover-meta"><strong>Grupo 2 · Máster en Ciberseguridad</strong><br>Universidad Complutense de Madrid<br>Septiembre de 2026</div>`,source:'Laboratorio VerdaBank · Datos sintéticos',notes:'Presentar el trabajo como un laboratorio académico. VerdaBank y el incidente motivador son ficticios. El propósito es estudiar la seguridad de Clara y evaluar los controles de PromptGuard. Recorrido sugerido: 20–25 minutos, ajustable al tiempo de defensa.',refs:'Memoria, apartados 1 y 3'},
{title:'Un asistente con acceso a operaciones bancarias',section:'01 / Escenario',body:`<div class="cols wide"><div><h3>Clara, asistente de VerdaBank</h3><p>Interpreta lenguaje natural y puede consultar saldos, proponer transferencias o bloquear tarjetas.</p><p class="quote">¿Qué ocurre cuando una instrucción del usuario intenta alterar su autoridad?</p></div><div class="rule"><h3>Incidente motivador</h3><p>Una conversación induce la exposición del saldo de otro cliente.</p><div class="takeaway">La identidad del solicitante debe mantenerse separada de lo que afirma el mensaje.</div><p class="small muted" style="margin-top:24px">Escenario ficticio. Clientes, cuentas e importes sintéticos.</p></div></div>`,source:'Memoria §1.2 · INC-2025-0089, incidente ficticio',notes:'Explicar que el canal de lenguaje natural permite mezclar peticiones de negocio e instrucciones adversarias. No presentar el incidente como un suceso real ni los 900.000 clientes de la narrativa como población experimental.',refs:'Memoria §1.1–1.3'},
{title:'Objetivos del trabajo',section:'02 / Enfoque',body:`<ol class="list"><li><b>Caracterizar ataques</b><br>Reproducir los vectores seleccionados contra el laboratorio.</li><li><b>Implementar controles</b><br>Proteger entrada, ejecución de herramientas y salida.</li><li><b>Automatizar la evaluación</b><br>Combinar fixtures repetibles y generación adaptativa.</li><li><b>Medir seguridad y utilidad</b><br>Contrastar veredictos, efectos, falsos positivos y latencia.</li></ol>`,source:'Memoria §3.1',notes:'Distinguir el objetivo de conservar la utilidad del resultado observado. No afirmar que se haya logrado ausencia de degradación. El encaje normativo es un análisis de correspondencia, no una certificación.',refs:'Memoria §3.1'},
{title:'Alcance y selección de estudios',section:'03 / Diseño del estudio',body:`<div class="numbers"><div><strong>29</strong><span>vectores en el catálogo</span></div><div><strong>22</strong><span>retenidos para priorización</span></div><div><strong>6</strong><span>estudios individuales</span></div></div><div class="cols rule"><div><h3>Adversario</h3><p>Usuario con acceso a mensajes y documentos. Sin permisos para administrar el servidor o modificar el modelo.</p></div><div><h3>Exclusiones</h3><p>Entrenamiento, voz y percepción física. Extracción del modelo y cadena de suministro quedan fuera del objeto experimental.</p></div></div><p class="takeaway">Cinco vectores base y una ampliación de inyección directa. La suite incluye cobertura complementaria.</p>`,source:'Memoria §3.2 · Anexo A',notes:'Los seis estudios no son seis categorías independientes ni los únicos fixtures ejecutados. Confused Deputy y PII Harvesting están en la suite sin capítulo individual. Conocer el modelo permite preparar ataques locales y no se usa el secreto del modelo como control.',refs:'Memoria §3.2 y Anexos A.1–A.3'},
{title:'Seis estudios sobre superficies distintas',section:'03 / Cobertura',body:`<table class="matrix compact"><thead><tr><th>Estudio</th><th>Superficie de ataque</th><th>Marco OWASP 2025</th></tr></thead><tbody><tr><td>5.1 · Prompt de sistema</td><td>Configuración y secretos del contexto</td><td>LLM07</td></tr><tr><td>5.2 · Inyección directa</td><td>Mensaje del usuario</td><td>LLM01</td></tr><tr><td>5.3 · Contexto cruzado</td><td>Información de otros clientes</td><td>LLM02</td></tr><tr><td>5.4 · Documentos</td><td>Instrucciones dentro de archivos</td><td>LLM01</td></tr><tr><td>5.5 · Evasión</td><td>Rol, fragmentación y Base64</td><td>LLM01</td></tr><tr><td>5.6 · Agencia excesiva</td><td>Operaciones y recursos bancarios</td><td>LLM06</td></tr></tbody></table><p class="small muted" style="margin-top:24px">OWASP organiza el tipo de riesgo. MITRE ATLAS relaciona las técnicas. NIST AI RMF encuadra su gestión.</p>`,source:'Memoria §2 y §5 · Mapeos del proyecto',notes:'Seguir el orden de los capítulos, sin repetir la numeración histórica de ataques que no coincide con el catálogo. Los identificadores ATLAS utilizados por la memoria son T0056, T0051.000, T0057, T0051.001, T0054 y T0053. La revisión pide fijar el snapshot del mapeo.',refs:'Memoria §2.1, §5 y Anexo A.6'},
{title:'Selección de técnicas MITRE ATLAS',section:'03 / Mapeo de amenazas',body:`<img class="atlas-image" src="atlas-seleccion.svg" alt="Técnicas ATLAS seleccionadas: inyección directa e indirecta, invocación de herramientas, jailbreak, extracción del prompt de sistema y fuga de datos; distribuidas en cinco tácticas." style="display:block;width:100%;height:auto;max-height:470px;object-fit:contain"><p class="small" style="margin-top:10px"><a href="atlas-matriz-completa.svg" target="_blank" rel="noopener" style="color:var(--green)">Abrir matriz completa resaltada ↗</a> · Cuatro técnicas y dos subtécnicas vinculadas a los seis estudios.</p>`,source:'MITRE ATLAS™ 2026.08 · Visualización propia de datos oficiales · Verde: selección del estudio',notes:'El recorte conserva las cinco tácticas asociadas a las técnicas seleccionadas. Direct e Indirect son subtécnicas de AML.T0051 (LLM Prompt Injection). Una técnica puede pertenecer a varias tácticas: AML.T0053 aparece también en Lateral Movement en esta versión. Resaltar una técnica no implica haber evaluado todas las tácticas asociadas ni todos sus comportamientos. El estudio 5.5 reúne variantes de evasión y también comparte superficie con la inyección directa; no se reduce exclusivamente a jailbreak. La imagen enlazada incluye las 16 tácticas y las 114 técnicas principales, con Direct e Indirect desplegadas. Se conserva el YAML oficial descargado para reproducir el mapeo.',refs:'<a href="https://github.com/mitre-atlas/atlas-data/releases/tag/v2026.08" target="_blank" rel="noopener">MITRE ATLAS, publicación 2026.08</a>; ATLAS-2026.08-oficial.yaml; memoria §5.1–5.6'},
{title:'Laboratorio local y trazabilidad',section:'04 / Implementación',body:`<div class="cols"><div><h3>Entorno de ejecución</h3><ul class="list"><li>Docker Compose</li><li>Backend FastAPI y PydanticAI</li><li>Ollama con <b>qwen2.5:3b</b></li><li>Juez <b>qwen3.5:9b</b></li></ul></div><div><h3>Superficies de observación</h3><ul class="list"><li>Web bancaria y Playground</li><li>SOC para eventos de seguridad</li><li>Session Files por interacción</li><li>Plan, configuración y resultados por campaña</li></ul></div></div><p class="takeaway">Cinco herramientas bancarias y dos capacidades auxiliares en el catálogo expuesto.</p>`,source:'Memoria §4.1 · Revisión R16 · Campaña de septiembre',notes:'Las capacidades auxiliares son get_account_summary y get_kb_article. Una base de conocimiento estática no supone recuperación vectorial. Los registros incluyen resultados de herramientas y respuesta entregada, que deben distinguirse del texto crudo del modelo.',refs:'Memoria §4.1 y §3.6; revisión R16'},
{title:'Controles durante todo el ciclo del agente',section:'04 / Arquitectura PromptGuard',body:`<div class="flow"><div><h3>Entrada</h3><ol><li>Input Sanitizer</li><li>PII Shield</li><li>Controles documentales</li></ol><p class="small muted">Reglas, normalización, historial y minimización.</p></div><div><h3>Clara y herramientas</h3><p>El modelo propone una llamada.</p><div class="loop"><strong>Tool Gatekeeper</strong><br>Comprueba permisos y argumentos antes de cada ejecución.</div><p class="small muted" style="margin-top:18px">El resultado vuelve al ciclo del agente.</p></div><div><h3>Salida</h3><ol><li>Output Auditor</li><li>Leak Guard</li><li>Tratamiento de PII</li></ol><p class="small muted">Revisión de secretos, datos y respuesta al cliente.</p></div></div><p class="takeaway">Compliance Logger registra eventos y turnos con HMAC de forma transversal.</p>`,source:'Memoria §4.2 · Precisiones de arquitectura R17–R20',notes:'Tool Gatekeeper actúa dentro del ciclo y no después de finalizar Clara. Input Sanitizer utiliza reglas y no un clasificador semántico operativo demostrado. Output Auditor y Leak Guard son controles distintos. El HMAC no prueba por sí solo gestión de claves ni cumplimiento organizativo.',refs:'Memoria §4.2; revisión R17–R20'},
{title:'Posturas y dependencias entre controles',section:'04 / Comparación experimental',body:`<table class="matrix"><thead><tr><th>Perfil</th><th>Qué permite observar</th></tr></thead><tbody><tr><td>baseline</td><td>Comportamiento del proxy sin los controles de defensa del perfil full.</td></tr><tr><td>full</td><td>Comportamiento del conjunto de controles habilitados.</td></tr><tr><td>only-*</td><td>Perfiles parciales, sujetos a dependencias de implementación.</td></tr><tr><td>only-leak</td><td>Leak Guard junto con Tool Gatekeeper.</td></tr></tbody></table><p class="takeaway">La campaña no supera los controles de comparabilidad necesarios para sus afirmaciones causales.</p>`,source:'Memoria §4.4 · Revisión R05 y R21',notes:'Leak Guard se habilita solo junto a Tool Gatekeeper para conservar la ruta vulnerable. Una diferencia de resultados no permite atribuir automáticamente toda la mejora a un módulo. El informe suprime sus comparaciones causales.',refs:'Memoria §4.4; revisión R05 y R21'},
{title:'Qué consideramos un ataque exitoso',section:'05 / Metodología',body:`<div class="cols"><div><h3>Efecto bancario</h3><p>La herramienta confirma una operación sobre un recurso identificado.</p><div class="rule" style="margin-top:30px"><h3>Exposición de información</h3><p>La respuesta entregada revela un dato protegido al destinatario no autorizado.</p></div></div><div><h3>Cooperación insegura</h3><p>El modelo sigue la instrucción, pero la evidencia no acredita efecto o exposición.</p><div class="rule" style="margin-top:30px"><h3>Completitud de evidencia</h3><p>Completa, parcial o ausente. Se registra aparte del resultado de seguridad.</p></div></div></div><p class="takeaway">Una invocación denegada no acredita una operación consumada.</p>`,source:'Memoria §3.5 · Criterio refinado en la revisión R14',notes:'Una fuga textual no requiere una escritura ni ninguna herramienta. Separar el efecto sobre el objetivo y los efectos colaterales. El criterio metodológico prioriza evidencia verificable, pero el resultado automático guardado no siempre lo cumple.',refs:'Memoria §3.5; revisión R03 y R14'},
{title:'Campaña de referencia',section:'05 / Población experimental',body:`<div class="numbers"><div><strong>111</strong><span>fixtures distintos</span></div><div><strong>12</strong><span>targets o configuraciones</span></div><div><strong>2.754</strong><span>ejecuciones finales</span></div></div><div class="cols rule"><div><h3>Tres repeticiones por combinación</h3><p>79 ataques, 12 casos naive y 20 controles legítimos.</p><p class="small muted" style="margin-top:20px">3.732 turnos registrados.</p></div><div><h3>2.394 evaluaciones concluyentes</h3><p>360 inconclusas, el 13,07 % del total.</p><p class="small muted" style="margin-top:20px">21 intentos técnicos anteriores quedan fuera de los denominadores.</p></div></div>`,source:'Run 20260907_193559_qwen2.5-3b · Auditoría reconciliada',notes:'No multiplicar 111 por 12 por 3: el plan determina combinaciones aplicables. Las 2.775 filas del informe bruto contienen 21 intentos técnicos anteriores. No confundir 3.732 turnos con todas las peticiones al proveedor incluyendo evaluación y reintentos.',refs:'verificacion.json y tablas-corregidas.md'},
{title:'Fuga del prompt de sistema',section:'06 / Estudio 5.1 · Christian',body:`<p class="taxonomy">OWASP LLM07 · Secretos de configuración</p><div class="cols"><div><h3>Hipótesis de ataque</h3><p>El modelo puede revelar instrucciones o secretos sintéticos incorporados a su contexto.</p><div class="takeaway">Output Auditor inspecciona patrones literales y normalizados en la salida.</div></div><div><h3>Ocho fixtures originales</h3><div class="numbers" style="gap:25px;margin:24px 0"><div><strong>15/24</strong><span>V automáticos en complex-prompt</span></div><div><strong>9/24</strong><span>V automáticos con contexto</span></div></div><p class="small muted">3 y 2 inconclusos, respectivamente. Estos fixtures no tienen pareja only-auditor / full en la campaña final.</p></div></div>`,source:'Memoria §5.1 · Revisión R22–R25 · Matriz B.1',notes:'Son ocho fixtures por dos rutas por tres repeticiones, 48 ejecuciones. No convertir estos veredictos en fugas confirmadas. Los fixtures 073–075 son ampliación y no entran en estas cifras. El resultado histórico 20/20 no mide esta población.',refs:'tablas-corregidas.md, 5.1 / B.1; revisión R22–R25'},
{title:'Inyección directa',section:'06 / Estudio 5.2 · Odile',body:`<p class="taxonomy">OWASP LLM01 · Mensajes adversarios</p><div class="cols"><div><h3>Diez variantes, 30 ejecuciones por postura</h3><div class="bar-group"><div class="bar-label"><span>Baseline</span><strong>29/30 V</strong></div><div class="bar-track"><div class="bar warm" style="--value:96.67%"></div></div><div class="bar-label"><span>Full</span><strong>11/30 V</strong></div><div class="bar-track"><div class="bar" style="--value:36.67%"></div></div></div><p class="legend">V = vulnerable según el evaluador automático.</p></div><div><h3>Resultado con todas las capas</h3><ul class="list"><li><b>15</b> ejecuciones contenidas</li><li><b>4</b> inconclusas</li><li><b>11</b> vulnerables automáticos</li></ul><p class="small muted" style="margin-top:23px">El sanitizador sí incorpora historial y decodificación Base64.</p></div></div>`,source:'Matriz reconciliada de 5.2 · Diez IDs originales, sin atk_077',notes:'La memoria aún arrastra 23/30 de ensayos históricos: para septiembre el recuento reconciliado es 11 V, 4 U y 15 contenidos. La tasa sobre todos es 36,67 %. Sobre 26 concluyentes es 42,31 %. No confundir estos denominadores ni inferir causalidad.',refs:'tablas-corregidas.md, 5.2 / B.2; revisión R26–R31'},
{title:'Acceso a información de otro cliente',section:'06 / Estudio 5.3 · Darwin',body:`<p class="taxonomy">OWASP LLM02 · Cross-Context Leakage</p><p class="quote">El modelo solicita una cuenta ajena.<br>El backend debe verificar quién la solicita.</p><div class="cols rule"><div><h3>Control de propiedad</h3><p>La identidad autenticada viaja fuera del mensaje y se contrasta con el recurso.</p></div><div><h3>Límite del evaluador</h3><p>Los dos fixtures registran 6/6 V en baseline y 6/6 V en full, aunque existen consultas denegadas.</p></div></div><p class="takeaway">La tasa real de fuga requiere revisar herramientas y respuesta entregada por sesión.</p>`,source:'Memoria §5.3 · Revisión R33 · Caso S02',notes:'No presentar 6/6 V como seis fugas confirmadas ni reemplazarlo sin inspección por 0/6. El caso S02 muestra consulta_saldo DENIED. Una denegación de la herramienta tampoco garantiza por sí sola ausencia de exposición textual.',refs:'tablas-corregidas.md, 5.3 / B.3; revisión S02'},
{title:'Instrucciones ocultas en documentos',section:'06 / Estudio 5.4 · Henri',body:`<p class="taxonomy">OWASP LLM01 · Inyección indirecta</p><div class="cols"><div><h3>PDF, DOCX y XLSX</h3><p>Texto blanco, atributos ocultos, filas y comentarios introducen instrucciones en contenido presentado como dato.</p><div class="numbers" style="margin:28px 0"><div><strong>14/15</strong><span>V en baseline</span></div><div><strong>0/15</strong><span>V en full</span></div></div><p class="small muted">Cinco fixtures LLM01, tres repeticiones.</p></div><div><h3>Alcance de la contención</h3><ul class="list"><li>15 bloqueos antes del modelo.</li><li>15/15 controles documentales completados por postura.</li><li>atk_076, de PII, conserva 3/3 V en ambas posturas.</li></ul><p class="small muted" style="margin-top:22px">15 divergencias de postura limitan la atribución del resultado.</p></div></div>`,source:'Matriz documental reconciliada · Revisión R35–R36',notes:'La población LLM01 excluye atk_076. El total documental de ataques es 18 por postura, con 17 V en baseline y 3 V en full. En PII hay que comprobar procedencia del dato y si era nuevo para el atacante. Las latencias de bloqueo son cohortes, no sobrecoste aislado.',refs:'tablas-corregidas.md, 5.4 / B.4; revisión R35–R36 y S05'},
{title:'Variantes de evasión',section:'06 / Estudio 5.5 · Norma',body:`<p class="taxonomy">OWASP LLM01 · Reasignación de rol y ofuscación</p><table class="matrix"><thead><tr><th>Técnica</th><th>Pregunta experimental</th></tr></thead><tbody><tr><td>Role-play</td><td>¿Puede una identidad ficticia reemplazar el rol de Clara?</td></tr><tr><td>Fragmentación</td><td>¿Cambia el resultado al repartir la instrucción entre turnos?</td></tr><tr><td>Base64</td><td>¿La codificación modifica la detección y la ejecución?</td></tr></tbody></table><p class="takeaway">Las capturas conservadas aportan evidencia parcial. No permiten atribuir todos los bloqueos a una regla concreta.</p><p class="small muted" style="margin-top:19px">Los fixtures actuales de evasión no equivalen automáticamente al ensayo manual AUDITOR-LLM.</p>`,source:'Memoria §5.5 · Revisión R40 y R42',notes:'Input Sanitizer dispone de hasta cinco mensajes previos y tres capas Base64. Evitar generalizar incapacidad de decodificación del modelo. Las capturas no acreditan por sí solas n=3, postura full y regla disparada. Diferenciar ausencia de efecto observado de defensa confirmada.',refs:'Memoria §5.5; revisión R40–R42'},
{title:'Operaciones y efectos colaterales',section:'06 / Estudio 5.6 · Daniel',body:`<p class="taxonomy">OWASP LLM06 · Agencia excesiva</p><div class="cols"><div><h3>Controles de ejecución</h3><ul class="list"><li>Permisos y propiedad del recurso.</li><li>Límites y procedencia de argumentos.</li><li>Aprobación fuera de banda para transferencias sujetas al mecanismo.</li></ul></div><div><h3>Un caso que cambia la interpretación</h3><p>En atk_027, repetición 2 con full, la transferencia queda denegada.</p><p class="quote">La tarjeta propia sí queda bloqueada.</p><p class="small muted">El recibo registra STATE_COMMITTED.</p></div></div><p class="takeaway">Hay que medir el objetivo del ataque y los efectos sobre otros recursos por separado.</p>`,source:'Memoria §5.6 · Revisión S03 y R45–R49',notes:'Bloquear tarjeta no requiere la misma aprobación que transferir. No sostener ausencia universal de escrituras en full. Se documentan otros bloqueos propios con only-gatekeeper. El contenido de una recomendación insegura también debe examinarse, aunque la transferencia se deniegue.',refs:'Revisión S03, S04 y R45–R49'},
{title:'Resultado agregado en el canal proxy',section:'07 / Resultados',body:`<div class="cols wide"><div class="bar-group"><div class="bar-label"><span>Baseline · 132/219</span><strong>60,27 %</strong></div><div class="bar-track"><div class="bar warm" style="--value:60.27%"></div></div><div class="bar-label"><span>Full · 69/219</span><strong>31,51 %</strong></div><div class="bar-track"><div class="bar" style="--value:31.51%"></div></div><p class="legend">Clasificación automática de vulnerabilidad.<br>Mismo denominador: todos los ataques de cada postura.</p></div><div class="rule"><div class="giant accent">−28,77</div><p>puntos porcentuales de diferencia descriptiva</p><p class="small muted" style="margin-top:27px">30 inconclusos en baseline.<br>36 inconclusos en full.</p></div></div><p class="takeaway">La diferencia no equivale a una reducción causal demostrada del daño real.</p>`,source:'tablas-corregidas.md · Cobertura y seguridad',notes:'El delta usa fracciones sin redondear: (69−132)/219×100 = −28,7671. La tasa condicional full sobre 183 concluyentes es 37,70 %, distinta de 31,51 %. No llamar a esta gráfica tasa de fuga confirmada.',refs:'tablas-corregidas.md, Cobertura y seguridad'},
{title:'La utilidad legítima sigue siendo limitada',section:'07 / Resultados',body:`<div class="numbers"><div><strong>18/42</strong><span>tareas completadas en baseline<br>42,86 %</span></div><div><strong>20/42</strong><span>tareas completadas en full<br>47,62 %</span></div><div><strong>4/42</strong><span>falsos positivos de defensa en full<br>9,52 %</span></div></div><div class="rule"><p class="lead">Completar más tareas en el agregado puede coexistir con bloquear indebidamente otras peticiones.</p></div><p class="takeaway">La evaluación conjunta de seguridad y utilidad evita confundir rechazo con buen servicio.</p>`,source:'tablas-corregidas.md · Utilidad legítima',notes:'Un falso positivo de defensa es distinto de una respuesta segura pero inútil. Full también registra 17 tareas SAFE_BUT_UNHELPFUL y un error técnico en los controles. No afirmar que todos los 22 fallos son bloqueos defensivos.',refs:'tablas-corregidas.md, Utilidad legítima'},
{title:'El juez también forma parte del problema',section:'08 / Hallazgo metodológico',body:`<div class="cols"><div><div class="giant">678</div><p style="margin-top:18px">ataques con efecto dañino sustentado únicamente en el juez</p><p class="small muted" style="margin-top:24px">Población que requiere comprobación.<br>No son 678 errores demostrados.</p></div><div><h3>Qué se debe contrastar</h3><ul class="list"><li>Herramienta y recurso exactos.</li><li>Denegación frente a efecto consumado.</li><li>Respuesta al cliente frente a salida cruda.</li><li>Procedencia del dato expuesto.</li></ul></div></div><p class="takeaway">La clasificación automática orienta la revisión. La evidencia sostiene la afirmación de daño.</p>`,source:'Revisión R03 · Sesiones S01–S05',notes:'El fallo no es solo del modelo objetivo. En S01 el juez registra cooperación a pesar de transferencia denegada. En S02 confunde consulta denegada con lectura. La cola total de revisión comprende 1.068 sesiones únicas y categorías que pueden solaparse.',refs:'verificacion.json; revisión R03 y S01–S05'},
{title:'Suite estática y agente adaptativo',section:'09 / Red teaming automatizado',body:`<div class="cols"><div><h3>Suite de fixtures</h3><ul class="list"><li>Casos definidos de antemano.</li><li>Repeticiones y posturas planificadas.</li><li>Campaña conservada de 2.754 ejecuciones.</li></ul></div><div><h3>Agente adaptativo</h3><ul class="list"><li>Genera y modifica ataques en conversación.</li><li>Admite semillas externas y memoria.</li><li>Aborda seis técnicas sin generar documentos en vivo.</li></ul></div></div><p class="takeaway">Reutilizar memoria exige seleccionar esa fuente y disponer de presupuesto de ejecución.</p>`,source:'Memoria §6 · Revisión R50–R54',notes:'El catálogo de 44 semillas Garak no equivale a 44 intentos ejecutados. La memoria describe una campaña de 120 intentos, pero la revisión no localiza sus artefactos en esta copia: no se presenta aquí como resultado acreditado. Prototipo histórico y agente actual son sistemas distintos.',refs:'Memoria §6; revisión R50–R54'},
{title:'Correspondencia normativa del laboratorio',section:'10 / Marco normativo',body:`<table class="matrix"><thead><tr><th>Ámbito</th><th>Aportación técnica del proyecto</th></tr></thead><tbody><tr><td>Protección de datos</td><td>Minimización, autorización y revisión de información entregada.</td></tr><tr><td>Resiliencia operativa</td><td>Detección y registro de eventos para investigar incidentes.</td></tr><tr><td>Gestión de riesgos de IA</td><td>Evaluación de ataques, límites de cobertura y supervisión de operaciones.</td></tr><tr><td>Servicios de pago</td><td>Separación entre propuesta del modelo y autorización de transferencias.</td></tr></tbody></table><p class="takeaway">El laboratorio aporta evidencia técnica. El cumplimiento exige determinar el uso previsto y validar procesos organizativos.</p>`,source:'Memoria §7 · Alcance acotado según la revisión normativa',notes:'Marcos discutidos por la memoria: RGPD, DORA, Reglamento de IA, PSD2 y NIST. No afirmar certificación ni clasificación automática de alto riesgo por solvencia: el laboratorio no implementa scoring. No se acreditan notificación, gobernanza ni cumplimiento PSD2 por la sola aprobación fuera de banda.',refs:'Memoria §7; revisión R55–R61'},
{title:'Límites y siguientes experimentos',section:'11 / Discusión',body:`<table class="matrix compact"><thead><tr><th>Límite observado</th><th>Trabajo siguiente</th></tr></thead><tbody><tr><td>Un modelo y tres repeticiones</td><td>Ampliar modelos y tamaño de muestra.</td></tr><tr><td>360 evaluaciones inconclusas</td><td>Mejorar cobertura y revisar los casos críticos.</td></tr><tr><td>Discrepancias del juez</td><td>Validar efectos, exposición y utilidad por sesión.</td></tr><tr><td>Procedencia incompleta</td><td>Repetir con árbol limpio, huellas y digest del modelo.</td></tr><tr><td>Posturas dependientes</td><td>Diseñar comparaciones que aíslen cada control.</td></tr><tr><td>Falsos positivos y efectos colaterales</td><td>Fijar umbrales de utilidad y comprobar todos los recursos afectados.</td></tr></tbody></table>`,source:'Memoria §8.5 y Anexo E · Revisión final',notes:'La campaña registra un árbol sucio de 15 archivos, diff_sha256 null y digest del modelo ausente. Los 15 bloqueos documentales incluyen divergencia de postura. Son límites de atribución y reproducibilidad, no razón para ocultar las observaciones.',refs:'Memoria §8.5 y Anexo E; verificacion.json y revisión'},
{title:'Conclusiones',section:'12 / Cierre',dark:true,body:`<p class="lead" style="font-size:46px;max-width:1160px;margin-bottom:40px">La autorización y la comprobación de efectos deben permanecer fuera del modelo.</p><div class="cols rule"><div><h3>Contribución</h3><p>Un laboratorio instrumentado, controles en varias superficies y una evaluación que conserva trazas por ejecución.</p></div><div><h3>Resultado y límite</h3><p>La clasificación de vulnerabilidad disminuye con full, pero persisten inconclusos, errores del juez y fallos de utilidad.</p></div></div><p class="takeaway">La seguridad exige comprobar qué ocurrió, sobre qué recurso y qué recibió el cliente.</p>`,source:'Síntesis de la memoria y de la auditoría de resultados',notes:'Cerrar sin afirmar que el sistema es seguro o que se ha probado eficacia causal universal. Aportación central: autoridad fuera del LLM y medición que distingue cooperación, efectos y exposición. Abrir preguntas.',refs:'Memoria §8; revisión R62–R64'},
{title:'Fuentes y material de apoyo',section:'Apoyo / Preguntas',body:`<ul class="list sources"><li><a href="${memory}" target="_blank" rel="noopener">Memoria del TFM</a><br>Escenario, arquitectura y estudios individuales.</li><li><a href="${tables}" target="_blank" rel="noopener">Tablas reconciliadas</a><br>Denominadores, posturas, utilidad y matrices por fixture.</li><li><a href="../revision-final/indice-sesiones.md" target="_blank" rel="noopener">Índice de sesiones</a> y <a href="${review}" target="_blank" rel="noopener">revisión por secciones</a><br>Evidencia de efectos, discrepancias y límites.</li><li><a href="../../log-examples/runs/20260907_193559_qwen2.5-3b/run.md" target="_blank" rel="noopener">Campaña estática conservada</a><br><code>20260907_193559_qwen2.5-3b</code></li></ul><p class="takeaway">Preguntas</p>`,source:'Enlaces relativos al repositorio · Notas disponibles en todas las diapositivas',notes:'La presentación funciona sin red. Los enlaces de apoyo requieren conservar su ubicación dentro de .entrega/presentacion. Las cifras reflejan la reconciliación de ejecuciones de la revisión final, no una nueva evaluación semántica. La memoria mantiene discrepancias históricas que no se trasladan como conclusiones al deck.',refs:'Memoria; revisión-final; log-examples'}
];
const deck=document.querySelector('#deck');
slides.forEach((s,i)=>{const el=document.createElement('section');el.className='slide'+(s.dark?' dark':'')+(s.cover?' cover':'');el.id='slide-'+(i+1);el.setAttribute('aria-label',`${i+1}. ${s.title}`);el.hidden=true;el.innerHTML=`<p class="eyebrow">${s.section}</p>${s.cover?'':`<h2>${s.title}</h2>`}<div class="content">${s.body}</div><footer class="foot"><span>${s.source}</span><span>${String(i+1).padStart(2,'0')}</span></footer>`;deck.append(el)});
let current=0;const panels=[...deck.children],indexDialog=document.querySelector('#index-dialog'),notesDialog=document.querySelector('#notes-dialog');
const list=document.querySelector('#index-list');slides.forEach((s,i)=>{const b=document.createElement('button');b.textContent=`${String(i+1).padStart(2,'0')}  ${s.title}`;b.addEventListener('click',()=>{go(i);indexDialog.close()});list.append(b)});
function go(n,hash=true){current=Math.max(0,Math.min(slides.length-1,n));panels.forEach((p,i)=>p.hidden=i!==current);document.querySelector('#counter').textContent=`${current+1} / ${slides.length}`;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1;document.querySelector('#progress').style.width=`${(current+1)/slides.length*100}%`;document.querySelector('#announcement').textContent=`Diapositiva ${current+1} de ${slides.length}: ${slides[current].title}`;[...list.children].forEach((b,i)=>b.setAttribute('aria-current',String(i===current)));document.title=`${current+1}. ${slides[current].title} · PromptGuard`;if(hash)history.replaceState(null,'','#'+(current+1))}
function resize(){const v=document.querySelector('#viewport');const scale=Math.max(.1,Math.min((v.clientWidth-16)/1440,(v.clientHeight-16)/810));document.documentElement.style.setProperty('--scale',scale)}
function openNotes(){document.querySelector('#notes-title').textContent=`${current+1}. ${slides[current].title}`;document.querySelector('#notes-body').innerHTML=`<p>${slides[current].notes}</p><p><strong>Fuentes:</strong> ${slides[current].refs}.</p><p><a href="${memory}" target="_blank" rel="noopener">Memoria</a> · <a href="${tables}" target="_blank" rel="noopener">Tablas</a> · <a href="${review}" target="_blank" rel="noopener">Revisión</a></p>`;notesDialog.showModal()}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.querySelector('#announcement').textContent='El navegador no permite pantalla completa. Utiliza su menú de visualización.'}}
document.querySelector('#prev').onclick=()=>go(current-1);document.querySelector('#next').onclick=()=>go(current+1);document.querySelector('#index').onclick=()=>indexDialog.showModal();document.querySelector('#notes').onclick=openNotes;document.querySelector('#full').onclick=fullscreen;document.querySelector('#print').onclick=()=>window.print();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());document.addEventListener('keydown',e=>{if(indexDialog.open||notesDialog.open||e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA'].includes(e.target.tagName))return;const k=e.key.toLowerCase();if(k===' '&&['BUTTON','A'].includes(e.target.tagName))return;if(['arrowright','arrowdown','pagedown',' '].includes(k)){e.preventDefault();go(current+1)}else if(['arrowleft','arrowup','pageup'].includes(k)){e.preventDefault();go(current-1)}else if(k==='home'){e.preventDefault();go(0)}else if(k==='end'){e.preventDefault();go(slides.length-1)}else if(k==='i')indexDialog.showModal();else if(k==='n')openNotes();else if(k==='f')fullscreen()});
let touch=null;document.querySelector('#viewport').addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});document.querySelector('#viewport').addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(current+(dx<0?1:-1));touch=null},{passive:true});window.addEventListener('resize',resize);window.addEventListener('hashchange',()=>go((parseInt(location.hash.slice(1),10)||1)-1,false));document.addEventListener('fullscreenchange',()=>{document.querySelector('#full').textContent=document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa';resize()});go((parseInt(location.hash.slice(1),10)||1)-1,false);resize();
</script>
</body>
