="23" font-weight="700">LLM Jailbreak</text><text x="618" y="212" fill="#d2e9cd" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">§5.5 · Evasión / jailbreak</text><rect x="897" y="20" width="276" height="74" fill="#142e2a"/><text x="910" y="48" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Lateral Movement</text><rect x="897" y="106" width="276" height="122" rx="3" fill="#146a52" stroke="#146a52"/><text x="909" y="129" fill="#cdeac7" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">AML.T0053</text><text x="909" y="155" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">AI Agent Tool</text><text x="909" y="181" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Invocation</text><text x="909" y="212" fill="#d2e9cd" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">§5.6 · Agencia excesiva</text><rect x="1188" y="20" width="276" height="74" fill="#142e2a"/><text x="1201" y="48" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Exfiltration</text><rect x="1188" y="106" width="276" height="122" rx="3" fill="#146a52" stroke="#146a52"/><text x="1200" y="129" fill="#cdeac7" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">AML.T0056</text><text x="1200" y="155" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Extract LLM System</text><text x="1200" y="179" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Prompt</text><text x="1200" y="212" fill="#d2e9cd" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">§5.1 · Prompt de sistema</text><rect x="1188" y="242" width="276" height="122" rx="3" fill="#146a52" stroke="#146a52"/><text x="1200" y="265" fill="#cdeac7" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">AML.T0057</text><text x="1200" y="291" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">LLM Data Leakage</text><text x="1200" y="348" fill="#d2e9cd" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">§5.3 · Contexto cruzado</text><text x="24" y="514" fill="#596d65" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">La misma técnica puede aparecer en varias tácticas. El resaltado identifica el mapeo, no una validación de toda la táctica.</text><text x="24" y="543" fill="#596d65" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">© The MITRE Corporation · Datos descargados el 16/09/2026 · Selección y representación: PromptGuard TFM</text></svg>
