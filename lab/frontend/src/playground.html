<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptGuard Lab — VerdaBank</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1>🏦 VerdaBank</h1>
                <span class="badge badge-danger">⚠️ VULNERABLE — Sin defensas</span>
            </div>
            <div class="header-right">
                <label for="mode-select">Modo:</label>
                <select id="mode-select">
                    <option value="simple-prompt">simple-prompt</option>
                    <option value="complex-prompt">complex-prompt</option>
                    <option value="complex-with-context" selected>complex-with-context</option>
                    <option value="complex-with-document">complex-with-document (adjuntar archivo)</option>
                </select>
                <label for="user-select">Usuario:</label>
                <select id="user-select">
                    <option value="usr_001">María García (usr_001)</option>
                    <option value="usr_002">Carlos Rodríguez (usr_002)</option>
                    <option value="usr_003">Ana Fernández (usr_003)</option>
                    <option value="usr_admin">Admin Banco (usr_admin)</option>
                </select>
                <button id="btn-clear" class="btn btn-secondary" title="Limpiar chat">🗑️</button>
            </div>
        </header>

        <!-- Main layout -->
        <div class="main-layout">
            <!-- Chat panel -->
            <div class="chat-panel">
                <div id="chat-messages" class="chat-messages">
                    <div class="system-message">
                        <p>🏦 <strong>Bienvenido al chat de VerdaBank</strong></p>
                        <p>Soy Clara, tu asistente virtual. ¿En qué puedo ayudarte?</p>
                        <p class="text-muted" style="font-size: 0.8em;">
                            ⚠️ Este es un entorno de laboratorio VULNERABLE. Sin protecciones de seguridad.
                        </p>
                    </div>
                </div>

                <!-- Adjuntar documento (solo visible en modo complex-with-document) -->
                <div id="document-attach" class="document-attach" style="display:none">
                    <label for="document-input">📎 Documento a adjuntar (PDF / DOCX / XLSX):</label>
                    <input type="file" id="document-input" accept=".pdf,.docx,.xlsx">
                    <span id="document-filename" class="text-muted" style="font-size:0.85em"></span>
                </div>

                <!-- Input -->
                <div class="chat-input">
                    <textarea
                        id="chat-input"
                        placeholder="Escribe tu mensaje..."
                        rows="2"
                    ></textarea>
                    <button id="btn-send" class="btn btn-primary">Enviar</button>
                </div>
            </div>

            <!-- Side panel: fixture browser -->
            <div class="side-panel">
                <h3>🎯 Fixture Browser</h3>
                <p class="text-muted" style="font-size: 0.85em; margin-bottom: 12px;">
                    ⚔️ ataque &nbsp;·&nbsp; ✅ legítimo &nbsp;·&nbsp; 🔰 naïve
                </p>
                <div id="fixture-list"></div>
            </div>
        </div>
    </div>

    <!-- Templates (hidden) -->
    <template id="msg-user">
        <div class="message message-user">
            <div class="msg-header">👤 <span class="user-name">Usuario</span></div>
            <div class="msg-body"></div>
            <div class="msg-meta"></div>
        </div>
    </template>

    <template id="msg-clara">
        <div class="message message-clara">
            <div class="msg-header">🤖 <strong>Clara</strong></div>
            <div class="msg-body"></div>
            <div class="msg-meta"></div>
        </div>
    </template>

    <template id="msg-error">
        <div class="message message-error">
            <div class="msg-header">❌ <strong>Error</strong></div>
            <div class="msg-body"></div>
        </div>
    </template>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
