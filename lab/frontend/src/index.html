<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerdaBank — Banca Digital</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/bank.css">
</head>
<body>
    <div id="app"></div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            console.log('[vb] Booting VerdaBank...');
            var scripts = ['js/config.js', 'js/state.js', 'js/api.js', 'js/views/login.js', 'js/views/dashboard.js', 'js/views/chat.js', 'js/router.js'];
            var loaded = 0;

            scripts.forEach(function(src) {
                var s = document.createElement('script');
                s.src = src;
                s.onload = function() {
                    loaded++;
                    console.log('[vb] Loaded ' + src + ' (' + loaded + '/' + scripts.length + ')');
                };
                s.onerror = function() {
                    console.error('[vb] FAILED to load ' + src);
                    document.getElementById('app').innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif"><h2>Error cargando la aplicacion</h2><p>No se pudo cargar: ' + src + '</p></div>';
                };
                document.body.appendChild(s);
            });
        });
    </script>
</body>
</html>
