# ============================================================
# PromptGuard FinTech Lab - entorno de laboratorio
#
# Arquitectura por defecto:
#   Frontend -> Backend (FastAPI/Clara) -> Ollama | OpenRouter | proxy custom
#
# El backend habla con un endpoint OpenAI-compatible y el proveedor
# se selecciona por entorno:
#   - LLM_PROVIDER=ollama
#   - LLM_PROVIDER=openrouter
#   - LLM_PROVIDER=custom
#
# Para OpenRouter o un proxy custom, solo cambia las variables del .env.
# ============================================================

services:
  backend:
    build: ./backend
    container_name: promptguard-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUDIT_DIR: /app/audit/sessions
      SOC_DOCS_DIR: /app/docs
      SOC_DB_PATH: /app/audit/soc.db
      PAYLOADS_DIR: /app/payloads
      # Dentro del contenedor backend, Ollama vive en el servicio Docker, no en localhost.
      JUDGE_BASE_URL: ${JUDGE_BASE_URL:-http://ollama:11434}
    volumes:
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./backend/tests:/app/tests
      - ./audit:/app/audit
      - ./scripts:/app/scripts
      - ./Makefile:/app/Makefile:ro
      # Ficheros reales usados por los fixtures de inyección indirecta.
      - ./payloads:/app/payloads:ro
      # Base de conocimiento del SOC, enlazada desde los eventos; solo lectura.
      - ../docs:/app/docs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # umask 0000: el backend corre como root y crea lab/audit/runs/... en el volumen
    # montado en cada petición de chat (audit_repository.append_turn). Sin esto, un
    # proceso del HOST (p.ej. redteam-agent/cli.py, que corre fuera de Docker) no
    # puede escribir run.json/run.md en el mismo Run Folder que el backend acaba de
    # crear como root:root 755 — PermissionError. No cambia quién es el usuario del
    # contenedor (root sigue siendo root); solo relaja el modo de los ficheros/
    # directorios NUEVOS que ese proceso cree a partir de ahora. Ver
    # el historial de Git para la validación del montaje.
    command: sh -c "umask 0000 && exec uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: promptguard-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      CHAT_ENDPOINT: ${CHAT_ENDPOINT:-proxy}
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: promptguard-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:

  # Proveedor custom opcional:
  # Si el equipo quiere usar LiteLLM o cualquier otro proxy OpenAI-compatible,
  # basta con arrancarlo aparte y poner LLM_PROVIDER=custom + LLM_BASE_URL.
