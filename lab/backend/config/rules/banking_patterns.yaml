# Patrones bancarios para detección de datos financieros.
# Usado por PII Shield y Output Auditor.

patterns:
  iban:
    regex: '\bES\d{2}\s?\d{4}\s?\d{4}\s?\d{4}\s?\d{4}\s?\d{4}\b'
    description: "IBAN español (ES + 22 dígitos)"
    action: "REDACT"
    token_format: "[IBAN-****{last4}]"

  credit_card_visa:
    regex: '\b4\d{12}(\d{3})?\b'
    description: "Tarjeta Visa"
    action: "REDACT"
    token_format: "[VISA-****{last4}]"

  credit_card_mastercard:
    regex: '\b(?:5[1-5]\d{2}|2[2-7]\d{2})\d{12}\b'
    description: "Tarjeta Mastercard"
    action: "REDACT"
    token_format: "[MC-****{last4}]"

  swift:
    regex: '\b[A-Z]{4}ES[A-Z0-9]{2}(?:[A-Z0-9]{3})?\b'
    description: "Código SWIFT/BIC español"
    action: "REDACT"
    token_format: "[SWIFT-****{last4}]"

  balance_eur:
    regex: '(?i)(saldo|balance|disponible|available)\s*:\s*\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{2})\s*(€|EUR|euros?)'
    description: "Saldo o balance en euros"
    action: "REDACT"
    token_format: "[BALANCE]"

  phone_es:
    # Los guardas (?<!\d) y (?!\d) NO son decorativos: sin ellos el patrón casa dentro de
    # cualquier tirada larga de dígitos. Medido sobre respuestas reales del lab: casaba dentro
    # del identificador de una reclamación (`REC-20260808075546` contiene `608080755`) y dentro
    # de la parte numérica de un IBAN español, marcando como "teléfono de un tercero" datos que
    # no eran ni teléfonos ni de terceros. Ver daniel-tfm/02-defensa/README.md.
    # El separador opcional va ligado al prefijo de país: suelto, `[\s-]?` se comía el espacio
    # anterior al número y la entidad detectada era " 612345678" en vez de "612345678".
    regex: '(?<!\d)(?:(?:\+34|0034)[\s-]?)?(?:6\d{2}|7\d{2}|9\d{2})[\s-]?\d{3}[\s-]?\d{3}(?!\d)'
    description: "Teléfono español"
    action: "REDACT"
    token_format: "[PHONE-****{last4}]"

  email:
    regex: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
    description: "Email"
    action: "REDACT"
    token_format: "[EMAIL-{first3}***@{domain}]"

  dni:
    regex: '\b\d{8}[A-HJ-NP-TV-Z]\b'
    description: "DNI/NIE español"
    action: "REDACT"
    token_format: "[DNI-****{last3}]"
