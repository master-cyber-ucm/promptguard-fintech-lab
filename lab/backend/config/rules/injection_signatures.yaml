# Firmas de prompt injection conocidas.
# Cada regla tiene: pattern (regex), action, severity, description.
# El Input Sanitizer las aplica como Capa 1 (determinista).

rules:
  # --- Instrucciones de override directo ---
  - name: "ignore_instructions"
    pattern: '(?i)(ignora|ignore|forget|descarta)\s+(todas?\s+)?(las?\s+)?(instrucciones|instructions|previous|anteriores|rules|reglas)'
    action: "BLOCK"
    severity: "CRITICAL"
    description: "Instrucción de ignorar instrucciones previas"

  - name: "system_override"
    pattern: '(?i)(system\s+)?(override|bypass|desactiva|disable)\s+(all\s+)?(restrictions|restricciones|filters|filtros|safety)'
    action: "BLOCK"
    severity: "CRITICAL"
    description: "Intento de override del sistema"

  - name: "you_are_now"
    pattern: '(?i)(you\s+are\s+now|eres\s+ahora|actua\s+como|actúa\s+como|from\s+now\s+on\s+you)\s+\w+'
    action: "BLOCK"
    severity: "HIGH"
    description: "Intento de redefinir el rol del asistente"

  - name: "new_persona"
    pattern: '(?i)(\bDAN\b|do\s+anything\s+now|sin\s+restricciones|unrestricted|jailbreak|jail\s+break)'
    action: "BLOCK"
    severity: "CRITICAL"
    description: "Patrones de jailbreak conocidos (DAN, etc.)"

  - name: "repeat_system_prompt"
    pattern: '(?i)(repeat|repite|show|muestra|print|imprime|output|devuelve)\s+(the\s+)?(above|anterior|previous|system|sistema)\s+(text|texto|prompt|instructions|instrucciones)\s*(verbatim|word|palabra)?'
    action: "BLOCK"
    severity: "HIGH"
    description: "Intento de extraer el system prompt"

  - name: "system_prompt_direct"
    pattern: '(?i)(what|cuáles?|dime|show|muéstrame)\s+(are\s+|es\s+)?(your|tus?)\s+(system|sistema)\s+(prompt|instrucciones|instructions)'
    action: "BLOCK"
    severity: "HIGH"
    description: "Pregunta directa por el system prompt"

  # --- Manipulación de tools bancarias ---
  - name: "tool_injection"
    pattern: '(?i)(ejecuta|execute|run|corre|llama|call|invoca)\s+(la\s+)?(tool|función|function|api)\s+'
    action: "BLOCK"
    severity: "CRITICAL"
    description: "Intento de invocar tools directamente"

  - name: "account_manipulation"
    pattern: '(?i)(consulta|check|muestra|show|dime|tell)\s+(el\s+)?(saldo|balance|cuenta|account)\s+(de|of|del)\s+'
    action: "SUSPICIOUS"
    severity: "HIGH"
    description: "Posible consulta de cuenta de terceros"

  - name: "transfer_manipulation"
    pattern: '(?i)(transfiere|transfer|envía|send|mueve|move)\s+(\d+[\.,]?\d*)\s*(euros?|€|EUR|dollar|\$)\s+(a|to)\s+'
    action: "SUSPICIOUS"
    severity: "CRITICAL"
    description: "Posible transferencia no autorizada"

  # --- Técnicas de evasión ---
  - name: "base64_payload"
    pattern: '(?i)(base64|decode|decodifica|from_base64|atob)\s*[\(:=]'
    action: "BLOCK"
    severity: "HIGH"
    description: "Posible payload codificado en Base64"

  - name: "obfuscation_markers"
    # BUG corregido (nunca detectado porque este fichero no estaba conectado a ningún código
    # hasta el sanitizador del ataque #7): las alternativas sueltas '1' y '0' matcheaban
    # CUALQUIER texto con esos dígitos (IBANs, fechas, importes) — ver
    # henri-tfm/02-defensa/README.md para el detalle. Se acotan a menciones explícitas de la
    # técnica (p. ej. "leet", "l33t"), no a dígitos sueltos.
    pattern: '(?i)(rot13|leet|l33t|camelCase|Pig\s+Latin)'
    action: "SUSPICIOUS"
    severity: "MEDIUM"
    description: "Técnicas de ofuscación del payload"

  - name: "prefix_injection"
    pattern: '(?i)(start\s+(your|the)\s+(response|answer)|comienza\s+(tu|la)\s+(respuesta|answer)\s+(with|con|saying|diciendo))\s+"?sure'
    action: "BLOCK"
    severity: "HIGH"
    description: "Prefix injection para forzar respuesta afirmativa"

  - name: "refusal_suppression"
    pattern: '(?i)(no\s+(digas|say)\s*["'']?(lo\s+siento|i''?m?\s*sorry|no\s+puedo|i\s+cannot|cannot\s+help))'
    action: "BLOCK"
    severity: "HIGH"
    description: "Supresión de mensajes de rechazo"

  # --- Extracción de información ---
  - name: "data_exfiltration"
    pattern: '(?i)(envía|send|post|fetch|request|curl|wget)\s+(a\s+|to\s+)?https?://'
    action: "BLOCK"
    severity: "CRITICAL"
    description: "Posible exfiltración de datos vía URL"

  - name: "markdown_image_exfil"
    pattern: '!\[.*?\]\(https?://[^\)]+\)'
    action: "SUSPICIOUS"
    severity: "HIGH"
    description: "Posible exfiltración vía imagen Markdown"

  # --- Patrones de contexto cruzado ---
  - name: "context_manipulation"
    pattern: '(?i)(el\s+usuario\s+(?:anterior|previo)|the\s+(?:previous|other)\s+user\s+said|en\s+la\s+sesión\s+anterior)'
    action: "SUSPICIOUS"
    severity: "HIGH"
    description: "Manipulación de contexto entre sesiones"

  # --- Prompt injection indirecta vía documento (ataque #7 — LLM01:2025 · AML.T0051.001) ---
  # Las reglas anteriores se diseñaron para inyección DIRECTA (texto de chat). Se comprobó
  # empíricamente (henri-tfm/02-defensa/README.md) que NO capturan el phrasing típico de un
  # payload embebido en un documento (nóminas, reclamaciones, hojas de cálculo) — motivo por el
  # que se añaden estas 3 reglas nuevas, validadas contra los payloads reales de la Fase 1
  # (los 5 variantes en PDF/DOCX/XLSX) y contra los 3 documentos sanos correspondientes (0 falsos
  # positivos).
  - name: "indirect_doc_authority_framing"
    channels: ["document"]
    # (?m) — multilínea: '^' debe anclar al inicio de CUALQUIER línea del texto extraído (p. ej.
    # una fila de XLSX con "INSTRUCCION:" en medio del documento), no solo al inicio del string
    # completo. Bug encontrado en la validación 2.3: sin (?m) esta regla no bloqueaba el caso
    # XLSX por esta vía (aunque otra regla sí lo bloqueaba, enmascarando el fallo).
    pattern: '(?im)(nota\s+(del\s+sistema|interna\s+de\s+tramitaci[oó]n)|^\s*instruccion\s*:|^\s*system\s*:)'
    action: "BLOCK"
    severity: "CRITICAL"
    description: "Marco de autoridad falso típico de payloads embebidos en documentos ('nota del sistema', 'nota interna', 'SYSTEM:')"

  - name: "indirect_doc_concealment"
    channels: ["document"]
    pattern: '(?i)no\s+(menciones|reveles)\s+(esta\s+)?(instrucci[oó]n|nota)'
    action: "BLOCK"
    severity: "CRITICAL"
    description: "Instrucción de auto-ocultación ('no menciones esta instrucción', 'no reveles esta nota')"

  - name: "indirect_doc_cross_account_request"
    channels: ["document"]
    pattern: '(?i)consult\w*\s+.{0,60}?\bsaldo\b.{0,40}?\bcuenta\b|\bsaldo\b.{0,40}?\bcuenta\b.{0,60}?consult\w*'
    action: "BLOCK"
    severity: "CRITICAL"
    description: "Solicitud de consulta de saldo de cuenta embebida en texto de documento (versión más flexible que 'account_manipulation', cubre formas verbales en gerundio y mayor distancia entre términos)"
